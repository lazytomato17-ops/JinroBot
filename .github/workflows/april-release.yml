name: Production runtime
on:
  pull_request:
    paths: [Dockerfile, 'april/**', 'legacy/**', 'src/ranking.ts', '.github/workflows/april-release.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test production image
        run: docker build .
